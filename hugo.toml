# ============================================================
# CONFIGURACIÓN DEL BLOG
# ============================================================

baseURL = "https://xaviharollovera.github.io/"
title = "Xavi Haro Llovera"
theme = "hugo-coder"
locale = "es"
defaultContentLanguage = "es"
enableEmoji = true

[pagination]
pagerSize = 6

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
author = "Xavi Haro Llovera"
description = "Blog de ciberseguridad de Xavi Haro Llovera"
keywords = "ciberseguridad,hardening,iptables,análisis de logs,gestión de incidentes,linux"
# Las frases que aparecen bajo tu nombre en la portada
info = ["Estudiante de ASIR", "Aprendiendo ciberseguridad"]
# Foto de perfil: guárdala en static/images/avatar.jpg y quita el # de la línea siguiente
# avatarURL = "images/avatar.jpg"
dateFormat = "2 January 2006"
since = 2026
# "auto" sigue el modo del navegador; también admite "light" y "dark"
colorScheme = "auto"
hideColorSchemeToggle = false
maxSeeAlsoItems = 5
customCSS = []
customSCSS = []
customJS = []
customRemoteJS = []

# Iconos de redes en la portada. Copia un bloque para añadir otra red.
[[params.social]]
name = "Github"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/xaviharollovera/"

[[params.social]]
name = "LinkedIn"
icon = "fa-brands fa-linkedin fa-2x"
weight = 2
url = "https://www.linkedin.com/in/xavi-haro-llovera-9096b6336/"

[[params.social]]
name = "RSS"
icon = "fa-solid fa-rss fa-2x"
weight = 3
url = "/index.xml"
rel = "alternate"
type = "application/rss+xml"

[languages.es]
label = "Español"

# Menú superior
[[languages.es.menu.main]]
name = "Sobre mí"
weight = 1
url = "about/"

[[languages.es.menu.main]]
name = "Blog"
weight = 2
url = "posts/"

[[languages.es.menu.main]]
name = "Proyectos"
weight = 3
url = "projects/"

[[languages.es.menu.main]]
name = "Contacto"
weight = 4
url = "contact/"
